<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head th:replace="/layout :: head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Furama - Employee List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Custom Styles -->
    <style>
        body {
            background: url("https://img.freepik.com/free-vector/soft-colorful-watercolor-texture-decorative-background-vector_1055-12347.jpg?w=2000") no-repeat center center fixed;
            background-size: cover;
        }
        header nav {
            background-image: linear-gradient(to top right, #EB9FC0, #B83F8F, #2C2867);
        }
        .navbar-brand img {
            max-height: 50px;
        }
        /* Animated welcome section */
        #animation {
            width: 600px;
            height: 50px;
            position: relative;
            animation: example 9s linear infinite alternate;
            margin: 1rem auto;
        }
        @keyframes example {
            0%   { background-color: #1bff03; left: 0; top: 0; }
            25%  { background-color: yellow; left: 900px; top: 0; }
            50%  { background-color: #0000ff; left: 900px; top: 900px; }
            75%  { background-color: #4b0080; left: 0; top: 900px; }
            100% { background-color: #00ff8f; left: 0; top: 0; }
        }
        .welcome-text {
            font-size: 3rem;
            color: #f1df9d;
            font-family: "Times New Roman", serif;
            font-weight: bold;
            font-style: italic;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 0;
            text-align: center;
        }
        h2 {
            font-size: 3rem;
            color: white;
            font-family: 'Trebuchet MS', sans-serif;
            font-weight: bold;
            text-align: center;
        }
        /* Giảm khoảng cách giữa các ô trong bảng */
        .table th,
        .table td {
            padding: 0.5rem !important;
        }
        footer {
            font-size: 14px;
        }
    </style>
</head>
<body>
<!-- Header -->
<header>
    <nav class="navbar navbar-expand-lg text-center">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="https://furamavietnam.com/wp-content/uploads/2018/08/logo.png" alt="Furama Logo" class="img-fluid">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active btn btn-outline-danger me-2" aria-current="page" href="https://trinhminhduc9x.github.io/FURAMA/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active btn btn-outline-warning me-2" href="https://trinhminhduc9x.github.io/FURAMA/employee/list">Employee</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active btn btn-outline-primary me-2" href="https://trinhminhduc9x.github.io/FURAMA/customer/list">Customer</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active btn btn-outline-secondary me-2" href="https://trinhminhduc9x.github.io/FURAMA/facility/list">Facility</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active btn btn-outline-success" href="https://trinhminhduc9x.github.io/FURAMA/contract/list">Contract</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success bg-warning" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
</header>
</body>
</html>


<!-- Nội dung trang: Form cập nhật thông tin khách hàng -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 form-card">
            <h2 class="text-center mb-4" style="font-weight: bold; color: #d63384; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
                Information
            </h2>
            <form method="post" action="/customer/update" th:object="${customerDto}">
                <!-- Trường ẩn chứa id khách hàng -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="tenChuHo" class="form-label">Tên Khách Hàng</label>
                    <input type="text" id="tenChuHo" name="tenChuHo" class="form-control"
                           th:field="*{name}" placeholder="Nhập tên khách hàng" title="Input cho đúng">
                    <div class="text-danger" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="tenHonThe" class="form-label">Ngày sinh</label>
                    <input type="date" id="tenHonThe" name="tenHonThe" class="form-control"
                           th:field="*{dateOfBirth}" title="Input cho đúng">
                    <div class="text-danger" th:errors="*{dateOfBirth}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Giới tính</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input type="radio" id="genderMale" class="form-check-input" th:field="*{gender}" value="0">
                            <label for="genderMale" class="form-check-label">MALE</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" id="genderFemale" class="form-check-input" th:field="*{gender}" value="1">
                            <label for="genderFemale" class="form-check-label">FEMALE</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="endtDate" class="form-label">Số chứng minh nhân dân</label>
                    <input type="number" id="endtDate" name="endtDate" class="form-control"
                           th:field="*{idCard}" placeholder="Nhập số CMND">
                    <div class="text-danger" th:errors="*{idCard}"></div>
                </div>

                <div class="mb-3">
                    <label for="phoneNumber" class="form-label">Số điện thoại</label>
                    <input type="number" id="phoneNumber" name="note" class="form-control"
                           th:field="*{phoneNumber}" placeholder="Nhập số điện thoại">
                    <div class="text-danger" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}" placeholder="Nhập email">
                    <div class="text-danger" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Địa chỉ</label>
                    <input type="text" id="address" class="form-control" th:field="*{address}" placeholder="Nhập địa chỉ">
                    <div class="text-danger" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label for="customerType" class="form-label">Kiểu Khách Hàng</label>
                    <select id="customerType" class="form-select" th:field="*{customerType}">
                        <option value="">-- Chọn kiểu khách hàng --</option>
                        <option th:each="p : ${customerTypes}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <input type="reset" value="Clear" class="btn btn-secondary">
                    <input type="submit" value="Submit" class="btn btn-success">
                </div>
            </form>
        </div>
    </div>
</div>


<!-- Footer: Lấy từ layout chung -->
<div th:replace="layout :: footer"></div>

<script src="/js/bootstrap.js"></script>
</body>
</html>
