<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="/layout :: head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Furama - Update Customer</title>
    <link rel="stylesheet" href="../static/bootstrap-5.0.2-dist/css/bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-image: linear-gradient(to top right, #EB9FC0, #B83F8F, #2C2867);
            font-size: 14px;
            color: #333;
        }
        .form-container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<!-- Header: lấy từ layout chung -->
<div th:replace="layout :: header"></div>

<!-- Nội dung trang: Form cập nhật thông tin khách hàng -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 form-container">
            <h2 class="text-center mb-4 text-primary">Cập nhật thông tin Khách Hàng</h2>
            <form method="post" action="/customer/update" th:object="${customerDto}">
                <!-- Trường ẩn chứa id khách hàng -->
                <input type="hidden" th:field="*{id_customer}" />

                <div class="mb-3">
                    <label for="name" class="form-label">Tên Khách Hàng</label>
                    <input type="text" id="name" name="tenChuHo" class="form-control" th:field="*{name}" placeholder="Nhập tên khách hàng">
                    <div class="text-danger" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="dateOfBirth" class="form-label">Ngày sinh</label>
                    <input type="date" id="dateOfBirth" name="tenHonThe" class="form-control" th:field="*{dateOfBirth}">
                    <div class="text-danger" th:errors="*{dateOfBirth}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Giới tính</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input type="radio" id="genderMale" class="form-check-input" th:field="*{gender}" value="0">
                            <label class="form-check-label" for="genderMale">MALE</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" id="genderFemale" class="form-check-input" th:field="*{gender}" value="1">
                            <label class="form-check-label" for="genderFemale">FEMALE</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="idCard" class="form-label">Số chứng minh nhân dân</label>
                    <input type="number" id="idCard" name="endtDate" class="form-control" th:field="*{idCard}" placeholder="Nhập số CMND">
                    <div class="text-danger" th:errors="*{idCard}"></div>
                </div>

                <div class="mb-3">
                    <label for="phoneNumber" class="form-label">Số điện thoại</label>
                    <input type="number" id="phoneNumber" name="note" class="form-control" th:field="*{phoneNumber}" placeholder="Nhập số điện thoại">
                    <div class="text-danger" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}" placeholder="Nhập email">
                    <div class="text-danger" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Địa chỉ</label>
                    <input type="text" id="address" class="form-control" th:field="*{address}" placeholder="Nhập địa chỉ">
                    <div class="text-danger" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label for="customerType" class="form-label">Kiểu Khách Hàng</label>
                    <select id="customerType" class="form-select" th:field="*{customerType}">
                        <option value="">-- Chọn kiểu khách hàng --</option>
                        <option th:each="p : ${customerTypes}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <input type="reset" value="Clear" class="btn btn-secondary">
                    <input type="submit" value="Submit" class="btn btn-success">
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer: lấy từ layout chung -->
<div th:replace="layout :: footer"></div>

<script src="/js/bootstrap.js"></script>
</body>
</html>
